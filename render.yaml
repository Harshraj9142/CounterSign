# Render Blueprint: New → Blueprint → pick this repo.
# Free instances sleep when idle and lose their disk on restart; SEED_ON_START
# re-creates the demo story, which is what you want for judges.
services:
  - type: web
    name: countersign
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: PAYPAL_MODE
        value: sandbox
      - key: SEED_ON_START
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SANDBOX_RECIPIENTS
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: MCP_TOKEN
        generateValue: true
      - key: MANDATE_SIGNING_KEY
        generateValue: true
